services:
  postgres:
    image: postgres:16
    container_name: prueba-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  usuarios-service:
    build:
      context: ../usuarios-service
    container_name: usuarios-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: clave-super-secreta-de-prueba-para-firmar-jwt-2026
    ports:
      - "8081:8081"

  pedidos-service:
    build:
      context: ../pedidos-service
    container_name: pedidos-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: clave-super-secreta-de-prueba-para-firmar-jwt-2026
    ports:
      - "8082:8082"

volumes:
  postgres_data:
