name: CI-CD usuarios-service a EC2

on:
  push:
    branches: ["main"]
    paths:
      - "usuarios-service/**"
      - "infra-docker/docker-compose.ec2.yml"
      - "scripts/desplegar-ec2.sh"
      - ".github/workflows/ci-cd-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/prueba1java-usuarios

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: usuarios-service/pom.xml

      - name: Compilar y ejecutar pruebas
        working-directory: usuarios-service
        run: mvn -B clean test

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./usuarios-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparar llave SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar archivos de despliegue a EC2
        shell: bash
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            infra-docker/docker-compose.ec2.yml \
            scripts/desplegar-ec2.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/prueba1java/"

      - name: Desplegar en EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF_DEPLOY
            set -e
            cd /opt/prueba1java
            cat > .env << 'EOF_ENV'
          DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF_ENV
            chmod +x desplegar-ec2.sh
            ./desplegar-ec2.sh
          EOF_DEPLOY
